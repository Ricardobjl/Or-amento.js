<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family: Arial, sans-serif;

  background: #f1f3f6;

  color: #222;

}

.app {

  max-width: 1100px;

  margin: auto;

  padding: 20px;

}

header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 25px;

}

header h1 {

  font-size: 28px;

}

header p {

  color: #777;

  margin-top: 5px;

}

.logo {

  width: 55px;

  height: 55px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #111;

  color: white;

  font-weight: bold;

  font-size: 20px;

}

.card {

  background: white;

  padding: 22px;

  border-radius: 14px;

  margin-bottom: 20px;

  box-shadow: 0 3px 10px rgba(0,0,0,.07);

}

.card h2 {

  margin-bottom: 20px;

  font-size: 19px;

}

.grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 15px;

}

.grid-servico {

  display: grid;

  grid-template-columns:
    2fr 1fr 1fr auto;

  gap: 15px;

  align-items: end;

}

.campo {

  display: flex;

  flex-direction: column;

  gap: 7px;

}

label {

  font-weight: bold;

  font-size: 14px;

}

input,
select {

  width: 100%;

  padding: 12px;

  border: 1px solid #ddd;

  border-radius: 8px;

  font-size: 15px;

}

input:focus,
select:focus {

  outline: none;

  border-color: #111;

}

.btn {

  border: none;

  padding: 12px 18px;

  border-radius: 8px;

  background: #111;

  color: white;

  cursor: pointer;

  font-weight: bold;

}

.btn:hover {

  opacity: .85;

}

.table-container {

  overflow-x: auto;

}

table {

  width: 100%;

  border-collapse: collapse;

}

th,
td {

  padding: 13px;

  border-bottom: 1px solid #eee;

  text-align: left;

}

th {

  background: #f7f7f7;

}

.btn-remover {

  border: none;

  background: #e53935;

  color: white;

  padding: 7px 10px;

  border-radius: 6px;

  cursor: pointer;

}

.resumo {

  display: flex;

  justify-content: space-between;

  align-items: end;

  gap: 30px;

}

.resumo > div:first-child {

  width: 200px;

}

.totais {

  min-width: 250px;

}

.totais p {

  display: flex;

  justify-content: space-between;

  margin: 8px 0;

}

.total-final {

  font-size: 22px;

  border-top: 1px solid #ddd;

  padding-top: 12px;

}

.btn-gerar {

  width: 100%;

  padding: 17px;

  border: none;

  border-radius: 10px;

  background: #111;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.btn-gerar:hover {

  opacity: .85;

}

#mensagem {

  margin-top: 20px;

  padding: 15px;

  border-radius: 8px;

  display: none;

}

.sucesso {

  display: block !important;

  background: #dff5e1;

  color: #176b22;

}

.erro {

  display: block !important;

  background: #ffe0e0;

  color: #a00000;

}


@media(max-width: 700px) {

  .grid,
  .grid-servico {

    grid-template-columns: 1fr;

  }

  .resumo {

    flex-direction: column;

    align-items: stretch;

  }

  .resumo > div:first-child {

    width: 100%;

  }

}

</style>
